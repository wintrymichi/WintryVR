# Gradle properties for the Android build. Unity substitutes the **TOKENS** when it generates the project.
#
# The two settings below exist because Gradle's build daemon talks to its launcher over a loopback socket, and
# on a machine where security software or a blocked IPv6 stack gets in the way that fails as
#
#     java.io.IOException: Unable to establish loopback connection
#
# which aborts the build after IL2CPP has already compiled everything — the most expensive possible moment.
# Pinning Java to IPv4 fixes the usual cause; running Gradle in-process removes the socket handshake entirely.
# Both cost a little build time and neither changes what ends up in the APK, which is a good trade for a build
# that works on someone else's machine.
org.gradle.jvmargs=-Xmx**JVM_HEAP_SIZE**M -Djava.net.preferIPv4Stack=true
org.gradle.daemon=false
org.gradle.parallel=false
unityStreamingAssets=**STREAMING_ASSETS**
**ADDITIONAL_PROPERTIES**
