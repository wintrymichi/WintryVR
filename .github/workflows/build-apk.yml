name: Build Quest APK

# Builds the APK and attaches it to a release. This exists because a Unity Android build shells out to Gradle,
# Gradle needs a working java.nio Selector, and that is built on an AF_UNIX socket pair on Windows — on a
# machine where AF_UNIX connect is broken (a stale Winsock LSP will do it) every Android build dies after
# IL2CPP with "Unable to establish loopback connection". A clean CI runner has none of that.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish the APK under (e.g. v0.1.0)"
        required: true
        default: v0.1.0
  push:
    tags: ["v*"]

jobs:
  build:
    name: Build for Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      # Unity's Library folder is expensive to rebuild: importing the Meta XR SDK alone takes minutes.
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Packages/manifest.json', 'Assets/**') }}
          restore-keys: |
            Library-Android-
            Library-

      - name: Build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.0.46f1
          targetPlatform: Android
          # The project's own entry point, so a CI build and a local build run exactly the same setup:
          # player settings, URP asset, TMP essentials, XR loader, scene list, then the build itself.
          buildMethod: WintryVR.EditorTools.WintryBuild.BuildQuestApk
          allowDirtyBuild: true

      - uses: actions/upload-artifact@v4
        with:
          name: WintryVR-apk
          path: |
            build/**/*.apk
            Build/**/*.apk

      - name: Attach to release
        if: github.event_name == 'push' || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            build/**/*.apk
            Build/**/*.apk
          generate_release_notes: true
